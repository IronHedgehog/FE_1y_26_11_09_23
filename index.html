2) шось в ній змінили
3) Запушили ваші зміни на гітхаб
4)Свічнули гілку на нову -->

<!-- Ретинізація контентних зображень -->

<!-- 1)Picture, source, srcset,img -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- Це тег який дозволяє розкадрувати(зробити зображення привабливого вигляду незалежно від щильності пікселів) зображення під будь-який пристрій -->

    <picture>
      <!-- Desktop -->
      <!-- source - пристрій -->
      <source
        srcset="./img/img-desctop.jpg 1x, ./img/img-desktop@2x.jpg 2x, ./img/img-desktop@3x.jpg 3x"
        media="(min-width:1200px)"
      />
      <!-- tablet -->
      <source
        srcset="./img/img-tablet.jpg 1x, ./img/img-teblet@2x.jpg 2x, ./img/img-teblet@3x.jpg 3x"
        media="(min-width:768px)"
      />
      <!-- phone -->
      <source
        srcset="./img/img-phone.jpg 1x, ./img/img-phone@2x.jpg 2x, ./img/img-phone@3x.jpg 3x"
        media="(min-width:0px)"
      />
      <!-- img - це зображення за замовчуванням, якщо не підійшов жоден з пристроїв -->
      <img src="./img/img-phone@3x.jpg" alt="Постер про баскетбол" />
    </picture>
  </body>
</html>
