    <!-- щоб стилювати svg,нам потрібно давати клас саме тегу svg -->
    <!-- svg + use -працюють добре тільки з спрайтами -->

    <!-- <img class="svg" src="./car.svg" alt="" /> -->

    <!-- для того щоб побачити svg зображення необхідна комбінація 
    1)Шлях до спрайту
  2)Поставити селектор id (#)
  3)id необхідного вам зображення(його можна знайте у тезі symbol)
  -->

    <ul>
      <li>

          <use href="./social.svg#icon-instagram"></use>

      </li>
      <li>

    </ul>

    <!-- 2) Створити тег i -->
