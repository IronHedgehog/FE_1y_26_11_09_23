<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <a class="logo" href=""><img src="./img/logo 1.png" alt="" /></a>
      <nav class="header-nav">
        <ul class="list">
          <li class="list-item"><a href="" class="list-link">asd</a></li>
          <li class="list-item"><a href="" class="list-link">qwe</a></li>
          <li class="list-item"><a href="" class="list-link">zxc</a></li>
        </ul>
      </nav>
      <button class="menu-button mob-menu__button--open">
        <svg class="menu-icon">
          <use href="./img/symbol-defs.svg#icon-menu"></use>
        </svg>
      </button>

      <div class="mobile-menu is-hidden mob-menu">
        <button class="close-button mob-menu__button--close">
          <svg class="icon-close">
            <use href="./img/symbol-defs.svg#icon-cross"></use>
          </svg>
        </button>

        <nav class="header-nav mobile-nav">
          <ul class="mobile-list">
            <li class="list-item"><a href="" class="list-link">asd</a></li>
            <li class="list-item"><a href="" class="list-link">qwe</a></li>
            <li class="list-item"><a href="" class="list-link">zxc</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <script src="./js/mobile-menu.js" type="module"></script>
  </body>
</html>
