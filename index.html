<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="section"></section>

    <section class="weather-cards">
      <div class="container">
        <ul class="card-list">
          <li class="card-item">
            <picture>
              <!-- desktop -->
              <source
                srcset="./img/img.webp 1x, ./img/img@2x.webp 2x, ./img/img@3x.webp 3x"
                media="(min-width:1200px)"
              />
              <!-- tablet -->
              <source
                srcset="
                  ./img/img-tablet.webp    1x,
                  ./img/img@2x-tablet.webp 2x,
                  ./img/img@3x-tablet.webp 3x
                "
                media="(min-width:768px)"
              />
              <!-- phone -->
              <source
                srcset="
                  ./img/img-mobile.jpg    1x,
                  ./img/img@2x-mobile.jpg 2x,
                  ./img/img@3x-mobile.jpg 3x
                "
                media="(min-width:0px)"
              />
              <img src="./img/img@3x-mobile.jpg" alt="" />
            </picture>
          </li>
        </ul>
      </div>
    </section>

    <!-- <img src="./img/img@3x.webp" alt="1x" /> -->
  </body>
</html>
